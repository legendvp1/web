<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Михайлец Владислав Павлович" />
    <meta
      name="description"
      content="Лабораторная работа 3: формы и Constraint Validation API"
    />
    <title>Лабораторная работа 3 — Михайлец В. П.</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <header class="navbar navbar-expand bg-dark" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand" href="#">DevHub</a>
        <nav aria-label="Основная навигация">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#"
                >Главная</a
              >
            </li>
            <li class="nav-item"><a class="nav-link" href="#">Проекты</a></li>
            <li class="nav-item"><a class="nav-link" href="#">О нас</a></li>
          </ul>
        </nav>
        <button type="button" class="btn btn-warning" id="open-dialog">
          Регистрация
        </button>
      </div>
    </header>

    <main class="container py-4">
      <h1>Регистрация участника</h1>
      <p>Нажмите «Регистрация», чтобы заполнить анкету.</p>
      <section id="cards" aria-live="polite" class="row g-3"></section>
    </main>

    <dialog id="register-dialog" aria-labelledby="dialog-title">
      <form id="register-form" novalidate>
        <h2 id="dialog-title" class="h4">Регистрация</h2>

        <div class="field">
          <label for="name" class="form-label">Имя (обязательно)</label>
          <input
            class="form-control"
            id="name"
            name="name"
            type="text"
            required
            minlength="2"
            pattern="[^0-9]+"
            autocomplete="name"
            aria-describedby="name-error"
          />
          <p class="error" id="name-error" aria-live="polite" hidden></p>
        </div>

        <div class="field">
          <label for="email" class="form-label">Почта (обязательно)</label>
          <input
            class="form-control"
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
            aria-describedby="email-error"
          />
          <p class="error" id="email-error" aria-live="polite" hidden></p>
        </div>

        <div class="field">
          <label for="phone" class="form-label">Телефон</label>
          <input
            class="form-control"
            id="phone"
            name="phone"
            type="tel"
            placeholder="+7 900 000-00-00"
            autocomplete="tel"
            aria-describedby="phone-error"
          />
          <p class="error" id="phone-error" aria-live="polite" hidden></p>
        </div>

        <div class="field">
          <label for="age" class="form-label">Возраст</label>
          <input
            class="form-control"
            id="age"
            name="age"
            type="number"
            min="1"
            max="99"
            step="1"
            inputmode="numeric"
            autocomplete="off"
            aria-describedby="age-error"
          />
          <p class="error" id="age-error" aria-live="polite" hidden></p>
        </div>

        <div class="field">
          <label for="github" class="form-label">Профиль GitHub</label>
          <input
            class="form-control"
            id="github"
            name="github"
            type="url"
            placeholder="https://github.com/username"
            autocomplete="url"
            aria-describedby="github-error"
          />
          <p class="error" id="github-error" aria-live="polite" hidden></p>
        </div>

        <div class="field">
          <label for="github-date" class="form-label"
            >Дата регистрации на GitHub</label
          >
          <input
            class="form-control"
            id="github-date"
            name="githubDate"
            type="date"
            autocomplete="off"
            aria-describedby="github-date-error"
          />
          <p class="error" id="github-date-error" aria-live="polite" hidden></p>
        </div>

        <div class="field">
          <label for="password" class="form-label">Пароль</label>
          <div class="input-group">
            <input
              class="form-control"
              id="password"
              name="password"
              type="password"
              minlength="6"
              autocomplete="new-password"
              aria-describedby="password-error"
            />
            <button
              type="button"
              class="btn btn-outline-secondary"
              id="show-password"
            >
              Показать
            </button>
          </div>
          <p class="error" id="password-error" aria-live="polite" hidden></p>
        </div>

        <div class="d-flex gap-2 justify-content-end">
          <button type="button" class="btn btn-secondary" id="close-dialog">
            Закрыть
          </button>
          <button type="submit" class="btn btn-primary">Отправить</button>
        </div>
      </form>
    </dialog>

    <footer class="container py-3 border-top">
      <p class="mb-0">© 2026 Михайлец Владислав Павлович</p>
    </footer>
  </body>
</html>
