<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Лабораторная работа №5: Fetch API и Storage"
    />
    <title>Лабораторная работа №5</title>
    <!-- Скрипт темы подключается синхронно в head, до отрисовки body: нет мерцания -->
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <header class="header">
      <span class="header__logo">Лаба 5</span>
      <button
        type="button"
        class="button button--ghost"
        id="theme-toggle"
        aria-label="Переключить тему"
      >
        Тёмная тема
      </button>
    </header>

    <main class="main">
      <h1>Михайлец Владислав Павлович - Лабораторная работа №5</h1>

      <section class="section" aria-labelledby="gallery-title">
        <div class="section__head">
          <h2 id="gallery-title">Галерея</h2>
          <button type="button" class="button" id="gallery-refresh">
            Обновить галерею
          </button>
        </div>
        <div
          class="gallery"
          id="gallery"
          aria-live="polite"
          aria-busy="false"
        ></div>
      </section>

      <section class="section" aria-labelledby="temp-title">
        <h2 id="temp-title">Температура в аудитории</h2>
        <form class="form" id="temp-form" novalidate>
          <div class="form__field">
            <label for="class-input">Номер аудитории</label>
            <input
              type="text"
              id="class-input"
              name="class"
              placeholder="Пр-1315"
              required
              autocomplete="off"
            />
          </div>
          <div class="form__field">
            <label for="temp-input">Температура, °C</label>
            <input
              type="number"
              id="temp-input"
              name="temp"
              step="0.1"
              placeholder="20.2"
              required
            />
          </div>
          <button type="submit" class="button" id="temp-submit">
            Отправить
          </button>
        </form>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <p class="toast__text" id="toast-text"></p>
      <button
        type="button"
        class="toast__close"
        id="toast-close"
        aria-label="Закрыть уведомление"
      >
        &times;
      </button>
    </div>
  </body>
</html>
